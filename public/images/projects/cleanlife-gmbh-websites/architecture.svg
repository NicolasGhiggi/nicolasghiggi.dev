<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
    <title>Cleanlife GmbH Architecture</title>
    <desc>Diagram showing the Public Website and Customer Portal connected through Single Sign-On, both connected to a shared MySQL database, with a Queue layer for asynchronous processes.</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
    </defs>

    <rect width="680" height="380" fill="#ffffff"/>

    <!-- Public Website -->
    <rect x="60" y="40" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="170" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Public Website</text>
    <text x="170" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">Catalog, quotes, contact</text>

    <!-- Customer Portal -->
    <rect x="400" y="40" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="510" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Customer Portal</text>
    <text x="510" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Orders, invoices, account</text>

    <!-- SSO connector -->
    <line x1="280" y1="68" x2="398" y2="68" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
    <text x="340" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">SSO</text>

    <!-- Queue -->
    <rect x="230" y="150" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="340" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Queue</text>
    <text x="340" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Email, PDF generation</text>

    <path d="M170 96 L170 178 L228 178" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>
    <path d="M510 96 L510 178 L452 178" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>

    <!-- MySQL -->
    <rect x="230" y="260" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="340" y="280" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">MySQL</text>
    <text x="340" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">Shared database</text>

    <path d="M170 96 L170 288 L228 288" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>
    <path d="M510 96 L510 288 L452 288" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>
</svg>