<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Product catalog hierarchy</title>
<desc>Tree diagram showing the catalog structure: Category at the top, branching into Subcategories, one of which branches into an Aggregation, which branches into individual Products.</desc>
<defs>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="420" fill="#ffffff"/>

<!-- Tier 1: Category -->
<rect x="270" y="30" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Category</text>
<text x="340" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">e.g. Cleaning products</text>

<!-- Connectors: Category -> Subcategories -->
<path d="M340 86 L340 106 L220 106 L220 128" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>
<path d="M340 86 L340 106 L460 106 L460 128" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>

<!-- Tier 2: Subcategory A -->
<rect x="140" y="130" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="220" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Subcategory</text>
<text x="220" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">e.g. Floor care</text>

<!-- Tier 2: Subcategory B (sibling, no children shown) -->
<rect x="380" y="130" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="460" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Subcategory</text>
<text x="460" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">e.g. Surface care</text>

<!-- Connector: Subcategory A -> Aggregation -->
<line x1="220" y1="186" x2="220" y2="228" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>

<!-- Tier 3: Aggregation -->
<rect x="140" y="230" width="160" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="220" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Aggregation</text>
<text x="220" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">e.g. Eco detergent line</text>

<!-- Connectors: Aggregation -> Products -->
<path d="M220 286 L220 306 L130 306 L130 328" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>
<path d="M220 286 L220 306 L290 306 L290 328" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>

<!-- Tier 4: Products -->
<rect x="60" y="330" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Product</text>
<text x="130" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">e.g. Floor cleaner 1L</text>

<rect x="220" y="330" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="290" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Product</text>
<text x="290" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">e.g. Floor cleaner 5L</text>
</svg>
