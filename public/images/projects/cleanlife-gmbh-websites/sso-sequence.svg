<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Single sign-on sequence flow</title>
<desc>Sequence diagram showing how single sign-on works between the two Cleanlife applications: the user logs into the public website, a signed token is generated, the user is redirected to the customer portal, the token signature is verified, and a session is created.</desc>
<defs>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="420" fill="#ffffff"/>

<!-- Actor boxes -->
<rect x="40" y="30" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="120" y="47" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">User</text>
<text x="120" y="65" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Browser</text>

<rect x="260" y="30" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="47" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Site A</text>
<text x="340" y="65" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">Public website</text>

<rect x="480" y="30" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="560" y="47" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Site B</text>
<text x="560" y="65" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Customer portal</text>

<!-- Lifelines -->
<line x1="120" y1="74" x2="120" y2="390" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="340" y1="74" x2="340" y2="390" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="560" y1="74" x2="560" y2="390" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- 1. User -> Site A: Login -->
<line x1="120" y1="120" x2="332" y2="120" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow-purple)"/>
<text x="230" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">1. Login request</text>

<!-- 2. Site A self-message: generate signed token -->
<path d="M340 152 L390 152 L390 182 L348 182" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow-purple)"/>
<text x="396" y="171" text-anchor="start" font-family="sans-serif" font-size="12" fill="#3C3489">2. Generate signed token</text>

<!-- 3. Site A -> Site B: redirect with token -->
<line x1="340" y1="230" x2="552" y2="230" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow-purple)"/>
<text x="450" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">3. Redirect with signed token</text>

<!-- 4. Site B self-message: verify signature -->
<path d="M560 262 L520 262 L520 292 L552 292" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow-teal)"/>
<text x="515" y="281" text-anchor="end" font-family="sans-serif" font-size="12" fill="#085041">4. Verify signature</text>

<!-- 5. Site B -> User: session created (return, dashed) -->
<line x1="560" y1="340" x2="128" y2="340" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-teal)"/>
<text x="340" y="332" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">5. Session created, access granted</text>
</svg>
