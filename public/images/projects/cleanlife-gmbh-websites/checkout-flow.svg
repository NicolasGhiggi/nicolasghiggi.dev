<svg width="680" height="140" viewBox="0 0 680 140" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Checkout and orders flow</title>
<desc>Horizontal flowchart showing the six-step purchasing flow: Browse, Cart, Review, Checkout, Order, Email confirmation.</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="140" fill="#ffffff"/>

<!-- Step 1: Browse -->
<rect x="40" y="40" width="84" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="82" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Browse</text>
<line x1="124" y1="62" x2="134" y2="62" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow-blue)"/>

<!-- Step 2: Cart -->
<rect x="136" y="40" width="84" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="178" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Cart</text>
<line x1="220" y1="62" x2="230" y2="62" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow-blue)"/>

<!-- Step 3: Review -->
<rect x="232" y="40" width="84" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="274" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Review</text>
<line x1="316" y1="62" x2="326" y2="62" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow-blue)"/>

<!-- Step 4: Checkout -->
<rect x="328" y="40" width="84" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="370" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Checkout</text>
<line x1="412" y1="62" x2="422" y2="62" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow-blue)"/>

<!-- Step 5: Order -->
<rect x="424" y="40" width="84" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="466" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Order</text>
<line x1="508" y1="62" x2="518" y2="62" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow-blue)"/>

<!-- Step 6: Email -->
<rect x="520" y="40" width="84" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="562" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Email</text>

<text x="340" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Order confirmation is sent automatically after checkout</text>
</svg>
