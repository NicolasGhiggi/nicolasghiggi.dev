name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        For security issues, **do not** use this form. See our [Security Policy](../blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console output
      description: Drag and drop images here, or paste relevant logs.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Firefox 130, Safari 18
  - type: input
    id: os
    attributes:
      label: OS / device
      placeholder: e.g. macOS 15, iPhone 15, Windows 11
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been reported yet
          required: true
        - label: I agree to follow the [Code of Conduct](../blob/main/CODE_OF_CONDUCT.md)
          required: true
